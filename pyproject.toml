[project]
name = "permit-stall-finder"
version = "0.1.0"
description = "Reconstructs LA building permit journeys from LADBS open data to detect and explain permitting stalls."
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0",
    "streamlit>=1.30",
    # Pure Python, so it installs on hosts where system libraries cannot be
    # added -- which rules out the HTML-to-PDF engines needing cairo/pango.
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
